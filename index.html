<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neue Academy · Preloader (Nebula violet)</title>
<meta name="description" content="Neue Academy preloader prototype: a nebula tunnel in waffle glyphs, with live controls.">
<link rel="icon" href="assets/logomark.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- the page the preloader reveals (placeholder for the hero) -->
  <div class="page" id="page">
    <nav><img src="assets/logomark.svg" alt="Neue Academy"><span>Paths</span><span>Products</span><span>Community</span><span>Pricing</span><b>Get started</b></nav>
    <div class="page-c"><p>The page underneath. The hero comes next.</p></div>
  </div>
  <canvas id="gl"></canvas>
  <div class="hud" id="hud">
    <img class="hud-logo" src="assets/logomark.svg" alt="">
    <span class="hud-n" id="hud-n">000</span>
    <span class="hud-l" id="hud-l"></span><span class="hud-r">Season 04</span>
  </div>
  <div class="bar">
    <button id="replay">Replay</button>
    <span class="fps" id="fps">– fps</span>
    <span class="hint">Press <kbd>H</kbd> to hide the controls · <kbd>R</kbd> to replay · <kbd>Space</kbd> to pause</span>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
